[workspace]
resolver = "2"
members = [
    "crates/eix-core",
    "crates/eix-plugin-abi",
    "crates/eix-plugin-sdk",
    "crates/eixd",
    "crates/eix-tui",
    "crates/eix-sdk",
    "examples/plugins/hello-dylib",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", default-features = false }
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.28"
rmpv = "1"
toml = "0.8"
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "default-syntaxes",
    "default-themes",
] }
glob = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
libc = "0.2"
arc-swap = "1"
base64 = "0.22"
ring = "0.17"
sha2 = "0.11"
libloading = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "process",
    "fs",
    "signal",
] }
