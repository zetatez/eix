[package]
name = "eix-nvim"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eix-nvim"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
async-trait = "0.1"
nvim-rs = { version = "0.6", features = ["use_tokio"] }
unicode-width = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
] }
