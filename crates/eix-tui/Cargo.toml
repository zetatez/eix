[package]
name = "eix-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eix"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
eix-core = { path = "../eix-core" }
eixd = { path = "../eixd" }
# Keep ratatui on the same crossterm as the rest of the TUI, and skip the
# backend/underline features we do not use: their weak optional deps would
# still be locked and would pull in a second sha2/block-buffer generation.
ratatui = { workspace = true, default-features = false, features = [
    "all-widgets",
    "crossterm_0_28",
    "layout-cache",
    "macros",
] }
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = "0.2"
base64 = { workspace = true }
syntect = { workspace = true }
libc = { workspace = true }
