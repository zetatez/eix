# ============================================================================
# eix config template (TOML reference)
# ============================================================================
# eix loads TOML.
# Global: ~/.config/eix/config.toml
# Project: <ancestor>/.eix/config.toml (nearest wins; arrays replace)
# Placeholders: {env:NAME}, {file:path}
# Keep secrets in environment variables, not in this file.
# ============================================================================


# Providers. Exactly one entry must set default = true; its table key is the
# model prefix. The default provider's model is the fallback used when a
# session has no explicit model and no runtime override.
#
# kind selects the wire protocol:
#   openai     (default) any OpenAI-compatible /chat/completions endpoint
#   anthropic  native Messages API
#   gemini     native generateContent /streamGenerateContent API
#
# Credential lookup: inline api_key -> api_key_env -> <data_dir>/auth/<name>.json
# (written by `eix auth login`; 0600, read on every request, no reload needed).
[providers.llmgate]
default = true
base_url = "http://127.0.0.1:3210/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key = ""

# [providers.openai]
# default = true
# name = "OpenAI"                 # optional display name
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"
#
# [providers.deepseek]
# base_url = "https://api.deepseek.com"
# api_key_env = "DEEPSEEK_API_KEY"
#
# [providers.opencode]
# base_url = "https://opencode.ai/zen/v1"
# api_key_env = "OPENCODE_API_KEY"
#
# [providers.groq]
# base_url = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"
#
# [providers.gemini]
# kind = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# model = "gemini-2.5-pro"
# api_key_env = "GEMINI_API_KEY"
#
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com"
# model = "claude-sonnet-4"
# api_key_env = "ANTHROPIC_API_KEY"

# [providers.anthropic.oauth]
# authorization_endpoint = "https://provider.example/authorize"
# token_endpoint = "https://provider.example/token"
# client_id = "eix"
# client_secret = ""            # optional
# scopes = ["openid", "offline_access"]
# redirect_uri = "http://127.0.0.1:8765/callback"  # optional
# extra_authorize_params = {}
# extra_token_params = {}

# [providers.xai]
# base_url = "https://api.x.ai/v1"
# api_key_env = "XAI_API_KEY"
#
# [providers.ollama]
# base_url = "http://localhost:11434/v1"  # no key

# Global provider runtime knobs (timeout, retries, default context window and
# system prompt). These are not per-provider settings.
[provider_runtime]
timeout_secs = 300
retry_attempts = 8
retry_base_ms = 250
retry_max_secs = 60
# Completion budget for protocols that require it (Anthropic, Gemini).
max_output_tokens = 8192
# context_tokens = 128000
# system_prompt = "You are eix..."

# Optional pinned models. `provider` references a providers key.
# `kind` overrides the provider's protocol for just this model.
# [[models]]
# id = "openrouter/gpt-5"
# provider = "openrouter"
# model = "openai/gpt-5"
# variants = ["low", "medium", "high"]
#
# [[models]]
# id = "anthropic-fast"
# provider = "anthropic"
# kind = "anthropic"
# model = "claude-haiku-4"

# Optional per-task models. Values are the same selection ids as `/model`
# (`provider/model`, optionally `#variant`) and are validated against
# providers/[[models]].
#
#   plan    read-only Plan-mode turns (task planning)
#   explore read-only sub-agents spawned by `spawn_agent`
#   execute normal read/write turns and background helpers
#
# An unset `plan` or `explore` falls back to `execute`; an unset `execute`
# falls back to the default provider model. A session pinned with `/model`
# (or an agent's own `model:`) still wins for that session; sub-agents prefer
# their agent model, then `explore`, then the parent's pin.
# [model_roles]
# plan = "anthropic/claude-sonnet-4"
# explore = "anthropic/claude-haiku-4"
# execute = "anthropic/claude-haiku-4"

# Tool safety. Defaults are shown; uncomment to change.
# The session mode (Plan/Build/Auto/Full) decides the capability ceiling and
# whether unruled default asks run automatically; explicit rules still apply.
[tools]
# Apply low/medium file patches inside the workspace immediately. Snapshots
# and patch records are still kept; set false to review each patch.
auto_apply_workspace_edits = true
# external_directory = ["/tmp/shared", "~/.cache/tool/**"]
# network_allow = ["docs.rs", "*.github.com"]
# Other defaults: max_output_bytes=20000, command_timeout_secs=60,
# max_parallel_subagents=32,
# sandbox="auto", sandbox_network=false,
# sandbox_read_paths=[~/.cargo, ~/.rustup, ~/.cache, ~/.npm],
# sandbox_writable_roots=[], snapshots=true.
#
# [[tools.rules]]
# tool = "exec_command"
# command = ["cargo", "test"]
# action = "sandbox"
#
# [[tools.rules]]
# tool = "exec_command"
# command_regex = '^rm '
# action = "deny"
#
# [[tools.rules]]
# tool = "apply_patch"
# path = "src/**"
# action = "ask"


# Worktrees are opt-in: `eix new --worktree` creates an isolated session,
# while TUI `/new-worktree` moves the current session into one.
# TUI `/new` only reuses the focused session's worktree, if any.
# `worktree.auto = true` restores lazy creation for CLI / auto-started sessions.
# `/ready` is user-triggered unless integration.auto_ready is enabled.
[worktree]
auto = false
base = "auto"          # session's starting branch; or an explicit branch

[integration]
auto_ready = false   # true scans idle sessions
auto_commit = true   # commit the worktree before /ready merges it

# Optional: notify on approval/input/error.
# [notifications]
# bell = false
# command = 'notify-send eix "$EIX_SESSION_NAME: $EIX_STATUS"'
# cooldown_secs = 10


# Context budget and compaction. Defaults are shown.
# [context]
# budget_tokens = 32000
# auto_compact = true
# auto_compact_threshold = 0.8
# auto_compact_keep_tokens = 8000  # recent conversation kept verbatim
# auto_compact_keep_turns = 2      # minimum recent turns even above token cap
# tool_output_tokens = 4000
# max_tool_schema_tokens = 12000
# instructions_files = ["AGENTS.md"]
# workspace_summary = true


# Compatibility with other agent harnesses. All switches are OFF by default;
# native .eix / ~/.config/eix resources are always loaded.
#
# Set one to true to load that harness's global and project resources:
#   claude_code: ~/.claude + .claude  (skills, commands, agents, CLAUDE.md)
#   opencode:    ~/.config/opencode + .opencode (skills, commands, agents, AGENTS.md)
#   codex_cli:   $CODEX_HOME + .codex (skills, prompts, AGENTS.md)
#   gemini_cli:  ~/.gemini + .gemini (skills, TOML commands, agents, GEMINI.md)
#   pi:          $PI_CODING_AGENT_DIR + .pi (skills, prompts, AGENTS.md/CLAUDE.md)
#
# Paseo skills live under ~/.claude/skills, so enable claude_code for those.
# OpenCode commands such as fix.bug live under ~/.config/opencode/commands,
# so enable opencode for those.
#
# Project .eix/config.toml may only turn these switches OFF; it cannot enable
# another agent's resources.
[compations]
claude_code = false
opencode = false
codex_cli = false
gemini_cli = false
pi = false


# Optional: remote TCP/HTTP attach. token is required when enabled.
# [server]
# tcp = "127.0.0.1:7420"
# http = "127.0.0.1:7421"
# token = "{env:EIX_REMOTE_TOKEN}"


# Common MCP servers. Local (stdio) servers start lazily and require
# Node.js/npx. Remote servers use the Streamable HTTP transport and can carry
# extra headers; `{env:NAME}` / `{file:path}` placeholders are expanded in
# global config only.
[mcp.servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# Remote example. `url` and `command` are mutually exclusive.
# [mcp.servers.docs]
# url = "https://mcp.example.com/mcp"
# timeout_secs = 30
# allowed_tools = ["search_*", "read_*"]
#
# [mcp.servers.docs.headers]
# Authorization = "Bearer {env:MCP_TOKEN}"
#
# OAuth alternative: run `eix mcp auth docs` once. Tokens are stored under
# the data dir (`oauth/mcp/docs.json`) and refreshed by the daemon.
# [mcp.servers.docs.oauth]
# scopes = ["read"]
# # Optional pre-registered client; otherwise dynamic registration is used.
# # client_id = "..."
# # client_secret = "..."

[mcp.servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp.servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp.servers.memory.env]
MEMORY_FILE_PATH = "{env:HOME}/.config/eix/memory.json"

# Optional browser automation; run `npx playwright install chromium` first.
# [mcp.servers.playwright]
# command = "npx"
# args = ["-y", "@playwright/mcp@latest"]

# Use allowed_tools / denied_tools to narrow tools if needed.


# Optional: out-of-process server plugins (plugin API v2, JSON-RPC 2.0).
# Only this global config can add plugins; project `.eix/config.toml` cannot.
# Plugins are trusted child processes (not an OS sandbox); their tools default
# to approval. A manifest-only plugin with [[contributes.commands]] does not
# start a process.
# See examples/plugins/echo/ and docs/plugins.md.
# [plugins.echo]
# enabled = true
# manifest = "examples/plugins/echo/eix-plugin.toml"
# capabilities = ["tools", "commands", "events", "storage"]
# timeout_secs = 30
# allowed_tools = ["word_*", "recall"]
# denied_tools = ["remember"]
#
# [plugins.echo.settings]
# repo = "acme"


# Image defaults: 4 per prompt, 8 MiB each, 30-day retention, 2 GiB store.
# [images]
# max_prompt_images = 4
# max_image_bytes = 8388608
# retention_days = 30
# max_store_bytes = 2147483648


# Diagnostics after writes are enabled by default for bash, cpp, css, go, html,
# json, lua, markdown, python, rust, sql, toml, typescript, and yaml. Servers
# start lazily when installed. Add [lsp.servers.<name>] only to override one or
# add another language.


# Post-write formatting is enabled by default and selected by extension,
# including Go, Rust, Python, JS/TS, C/C++, Shell, Lua, TOML, SQL, HCL, Nix,
# Kotlin, Swift, Dart, Elixir, Haskell, OCaml, Scala, Ruby, PHP, R, Zig, Nim,
# V, Crystal, Gleam, Elm, Clojure, Solidity, Markdown, JSON, YAML, HTML/CSS,
# GraphQL, Proto, and more. Missing executables are skipped silently.
# eix appends the file path to `command`; entries listed here override the
# built-in candidates. Set `formatter_defaults = false` to disable the built-in
# fallback entirely.
# [[formatter]]
# command = "rustfmt --edition 2021"
# extensions = ["rs"]
#
# [[formatter]]
# command = "prettier --write"
# extensions = ["json"]


# Optional: TUI palette. Presets are named <light|dark>-<scheme> and sorted
# by scheme name (light before dark in each pair):
#   light-catppuccin, dark-catppuccin, light-delek, dark-desert, dark-dracula,
#   light-github, dark-github, light-gruvbox, dark-gruvbox, dark-mariana,
#   dark-monokai, dark-nord, light-one, dark-one, light-peachpuff, dark-ron,
#   light-rose-pine, light-solarized, dark-solarized, dark-tokyo, light-zellner
# dark-monokai / dark-mariana are Sublime Text-inspired.
[theme]
preset = "dark-github"


# Optional: global/TUI keymap. Defaults are built in; an entry here replaces
# that action's default binding(s), it does not add an alias. The leader prefix
# defaults to Space and can be changed with `leader`.
#
# Values are one key ("C-t", "F2", "?") or one leader chord ("Space n" /
# "leader n"). Bare letters are allowed for normal/transcript actions; actions
# that can be configured globally (quit/help/sessions/models/timeline/reasoning/
# tab_N) are demoted to normal/transcript mode when given a bare letter.
# Overlay-internal navigation (picker/help/approval/diff/process/inbox) is fixed.
#
# Defaults:
#   leader            Space
#   quit              Ctrl-C / Ctrl-D / Z (Z only in normal/transcript)
#   help              F1
#   sessions          Space g
#   palette           Ctrl-P
#   models            Ctrl-/ / Ctrl-_ / Ctrl-7
#   timeline          Space h
#   cycle_reasoning   Ctrl-T
#   tab_1 … tab_9     Ctrl-1 … Ctrl-9 (tab_7 is unused; Ctrl-7 = models)
#   new_session       Space n
#   new_worktree      Space W
#   new_pane          Space o
#   files             Space f
#   grep              Space s
#   subagents         Space i
#   git               Space G
#   processes         Space p
#   inbox             Space a
#   cancel            Space x
#   close_pane        q / Space c
#   mode              Space m
#   layout_horizontal Space v
#   layout_tabby      Space t
#   layout_fibonacci  Space r
#   layout_cycle      Space l
#   pane_prev         <
#   pane_next         >
#   cycle_mode        Tab
#   cycle_mode_back   Shift-Tab
#   page_up           PageUp / Ctrl-B / Ctrl-U
#   page_down         PageDown / Ctrl-F
#
# Config-only actions (no default key): scroll_up, scroll_down, next_session,
# prev_session, fork, attention, todos, undo, redo.
#
# Example overrides (leader defaults to Space):
[keys]
leader = "Space"
# sessions = "C-t"
# new_session = "leader N"
# close_pane = "C-q"
# help = "F2"
