# --- Compatibility ----------------------------------------------------------
# Load other harnesses' global/project resources; project layers can only
# turn these off.
[compations]
claude_code = false                  # ~/.claude + .claude
opencode = false                     # ~/.config/opencode + .opencode
codex_cli = false                    # $CODEX_HOME + .codex
gemini_cli = false                   # ~/.gemini + .gemini
pi = false                           # $PI_CODING_AGENT_DIR + .pi

# --- Remote ----------------------------------------------------------------
# [server]
# tcp = "127.0.0.1:7420"
# http = "127.0.0.1:7421"
# token = "{env:EIX_REMOTE_TOKEN}"

# --- Plugins ----------------------------------------------------------------
# Trusted child processes (not OS-sandboxed); global config only.

# [plugins.echo]
# enabled = true
# lazy = false                 # defer startup until plugin.start / /plugins start
# manifest = "examples/plugins/echo/eix-plugin.toml"
# capabilities = ["tools", "commands"]
# timeout_secs = 30
# require_signature = false    # refuse unsigned packages / manifests without [package]
# sandbox = false              # Linux: no_new_privs + rlimits + Landlock (opt-in)
# allowed_tools = ["word_*"]
# denied_tools = ["remember"]
#
# Capability-scoped allowlists are empty by default and deny everything.
# network_allow accepts exact hosts or one leading `*.` wildcard.
# network_allow = ["api.example.com", "*.example-cdn.com"]
# secrets lists environment variable names readable through host.secrets.get.
# secrets = ["ECHO_TOKEN"]
# rpc_allow lists other plugins callable through host.rpc.call; "*" allows all.
# rpc_allow = ["other-plugin"]
#
# [plugins.echo.settings]
# repo = "acme"

# No manifest: run the command directly.
# [plugins.local]
# command = "python3"
# args = ["plugin.py"]
# env = { LOG_LEVEL = "debug" }
# cwd = "plugins"

# --- Images -----------------------------------------------------------------
# [images]
# max_prompt_images = 4
# max_image_bytes = 8388608
# retention_days = 30
# max_store_bytes = 2147483648

# --- Math --------------------------------------------------------------------
# Display math is rendered as a terminal image (Kitty, Sixel or iTerm2) when
# the terminal supports it, and as 2D ASCII text otherwise. Inline math uses a
# single-row image; a formula too wide for one row keeps its `$...$` source.
# `/math off` (or `images = false`) turns rendering off completely: formulas
# stay as the literal `$...$` / `$$...$$` TeX instead of falling back to ASCII.
# The TUI shells out to `latex`/`dvipng` (or `xelatex` + poppler for CJK).
# `/math status` reports the detected mode and the reason for a fallback.
# Rendered PNGs are cached under the OS cache directory (`~/.cache/eix/math`)
# so reopening a session does not re-run TeX. EIX_MATH_CACHE=0 disables it.
# [math]
# images = true
# dpi = 200
# max_source_bytes = 65536
# min_scale = 0.5
# max_rows = 60
# Extra preamble (macros, packages) for formulas. Trusted config only: project
# layers cannot set it. EIX_MATH_DPI overrides `dpi`.
# preamble = "\newcommand{\R}{\mathbb{R}}"

# --- LSP --------------------------------------------------------------------
# Built in: bash, cpp, css, go, html, json, lua, markdown, python, rust, sql,
# toml, typescript, yaml. Override or add one here.
# [lsp.servers.rust]
# command = "rust-analyzer"
# extensions = ["rs"]
# timeout_secs = 30

# --- Formatters -------------------------------------------------------------
# Built-in per-extension table; entries here override it.

# [[formatter]]
# command = "rustfmt --edition 2021"
# extensions = ["rs"]

# [[formatter]]
# command = "prettier --write"
# extensions = ["json", "css", "html"]

# Disable one extension with an empty command.
# [[formatter]]
# extensions = ["md"]

# --- Theme ------------------------------------------------------------------
# Presets: light-catppuccin, dark-catppuccin, light-delek, dark-desert,
# dark-dracula, light-eink, light-eink-mono, light-github, dark-github,
# light-gruvbox, dark-gruvbox, dark-monokai, dark-nord, light-one, dark-one,
# light-peachpuff, dark-ron, light-rose-pine, light-solarized,
# dark-solarized, dark-tokyo.
[theme]
preset = "dark-github"
# normal = "#c0caf5"
# comment = "#565f89"
# string = "#9ece6a"
# function = "#7aa2f7"
# error = "#f7768e"
# diff_add = "#9ece6a"
# diff_delete = "#f7768e"
# panel = "#1f2335"

# --- Keys -------------------------------------------------------------------
# Overrides replace that action's defaults; a comma-separated value binds
# several keys. Leader chords use `leader X`; `leader` only changes the prefix.
[keys]
leader = "Space"
quit = "Ctrl-c, Ctrl-d, Z"
help = "F1"
models = "Ctrl-/, Ctrl-_, Ctrl-7"
cycle_reasoning = "Ctrl-t"
# Hold to dictate, release to stop. Needs a terminal that reports key release
# events (kitty keyboard protocol); elsewhere the second press stops instead.
voice = "F2"
palette = "Ctrl-p"
page_up = "PageUp, Ctrl-b, Ctrl-u"
page_down = "PageDown, Ctrl-f"
pane_prev = "<"
pane_next = ">"
cycle_mode = "Tab"
cycle_mode_back = "BackTab, S-Tab"
close_pane = "q"

# Ctrl-1..9 focus the matching session. Ctrl-7 stays on the model picker.
tab_1 = "Ctrl-1"
tab_2 = "Ctrl-2"
tab_3 = "Ctrl-3"
tab_4 = "Ctrl-4"
tab_5 = "Ctrl-5"
tab_6 = "Ctrl-6"
tab_8 = "Ctrl-8"
tab_9 = "Ctrl-9"

# Leader chords: Space then the key below.
new_session = "leader n"
new_worktree = "leader W"
sessions = "leader o"
files = "leader f"
grep = "leader s"
git = "leader g"
timeline = "leader h"
processes = "leader b"
inbox = "leader a"
cancel = "leader x"
colorscheme = "leader c"
layout_horizontal = "leader v"
layout_tabby = "leader t"
layout_fibonacci = "leader r"
layout_cycle = "leader l"

# --- MCP --------------------------------------------------------------------
# stdio servers start lazily and need Node.js / npx.
[mcp.servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp.servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp.servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp.servers.memory.env]
MEMORY_FILE_PATH = "{env:HOME}/.config/eix/memory.json"

# Remote server (Streamable HTTP; `url` and `command` are exclusive).
# [mcp.servers.docs]
# url = "https://mcp.example.com/mcp"
# timeout_secs = 30
# allowed_tools = ["search_*", "read_*"]
# denied_tools = ["write_*"]
#
# [mcp.servers.docs.headers]
# Authorization = "Bearer {env:MCP_TOKEN}"
#
# [mcp.servers.docs.oauth]
# scopes = ["read"]                  # or run `eix mcp auth docs`

# Keep an entry but disable it.
# [mcp.servers.playwright]
# enabled = false

# Speech to text. On by default but inert: nothing is recorded and nothing is
# sent until the user asks for `/voice`, so an idle session never opens a
# microphone. See docs/voice.md for the helper protocol and the event shapes.
# Everything below has a working default; leave the rest out.
[voice]
enabled = true
# "local" runs an external helper, "cloud" posts one request per utterance,
# "fake" needs neither and is meant for tests.
backend = "local"
# Empty lets the engine detect the language.
language = ""

# Microphone capture, used by clients (`/voice` in the TUI). The daemon never
# opens a device; a recorder's stdout is read as raw PCM16 mono 16 kHz.
[voice.capture]
# Empty picks the first of parec, pw-record, arecord found on PATH.
command = ""
# Speech gate, RMS on a 0.0-1.0 scale. The default hears a soft voice in a
# quiet room; raise it only if background noise keeps an utterance open, or
# lower it if the first syllable is being missed.
threshold = 0.004

[voice.local]
# whisper | sherpa | fake. Empty picks automatically: sherpa (SenseVoice) when
# that model is installed, because it is far better on Chinese than a whisper
# model small enough to dictate with; whisper otherwise.
engine = ""
# Empty finds `eix-asr` on PATH, next to eixd, or in ~/.local/bin.
# command = "/usr/local/bin/eix-asr"
# A ggml-*.bin file; empty picks the largest one in <data-dir>/models, which is
# the most accurate installed model. Install one with:
#   curl -L -o ~/.local/share/eix/models/ggml-base.bin \
#     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
# model_dir = "~/.local/share/eix/models/ggml-base.bin"
# Escape hatch: replaces the derived helper arguments entirely.
# args = ["--engine", "whisper", "--model", "/path/ggml-base.bin"]

# Second pass over each finished transcript by a chat model. Useful with a
# small local engine: whisper tiny mishears identifiers and drops punctuation,
# and a chat model fixes that without a bigger acoustic model. The same pass
# removes fillers and stutters, and joins the fragments of a broken train of
# thought into complete sentences. It never summarises or answers.
[voice.refine]
# On by default: it is what turns repetitive, mistyped dictation into usable
# text. It sends the transcript (never the audio) to the chat provider.
enabled = true
# Model selection id ("provider/model"). Empty uses the default model.
model = ""
# Extra instruction appended to the built-in editing prompt: domain vocabulary,
# naming rules, tone. It does not replace the built-in rules.
prompt = ""
# Hard cap, in ms. Past it the raw transcript is used unchanged.
timeout_ms = 8000

[voice.cloud]
# deepgram | openai | custom.
provider = "deepgram"
# model = "nova-3"
# endpoint = "wss://api.deepgram.com/v1/listen"
# Credential slot; the key itself lives in `eix auth`, not here.
# credential = "asr.deepgram"
