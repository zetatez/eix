# eix configuration (TOML)
#
# Global:  ~/.config/eix/config.toml
# Project: <ancestor>/.eix/config.toml (nearest wins; tighten-only)
# Placeholders: {env:NAME}, {file:path} (global/explicit layers only)
#
# Root keys (no table) must stay above the first [table].
# formatter_defaults = true

# --- Providers --------------------------------------------------------------
# The table key is the model prefix. Exactly one provider sets default = true.

[providers.llmgate]
default = true
base_url = "http://127.0.0.1:3210/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key = ""
# api_key_env = "LLMGATE_API_KEY"
# name = "LLM Gate"

# OpenAI-compatible endpoints.
# [providers.openai]
# name = "OpenAI"
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"

# [providers.deepseek]
# base_url = "https://api.deepseek.com"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"

# DeepSeek native Messages protocol: signed thinking replay, effort control
# (off/low/high/max), in-history prompt updates, and cache-token accounting.
# [providers.deepseek-native]
# kind = "deepseek"
# base_url = "https://api.deepseek.com/anthropic"
# model = "deepseek-v4-flash"
# api_key_env = "DEEPSEEK_API_KEY"

# [providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# model = "anthropic/claude-sonnet-4"
# api_key_env = "OPENROUTER_API_KEY"

# [providers.groq]
# base_url = "https://api.groq.com/openai/v1"
# model = "llama-3.3-70b-versatile"
# api_key_env = "GROQ_API_KEY"

# [providers.xai]
# base_url = "https://api.x.ai/v1"
# model = "grok-3"
# api_key_env = "XAI_API_KEY"

# [providers.ollama]                 # local, no key
# base_url = "http://localhost:11434/v1"
# model = "qwen2.5-coder:7b"

# Native protocols: kind = "anthropic" | "gemini".
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com"
# model = "claude-sonnet-4"
# api_key_env = "ANTHROPIC_API_KEY"

# [providers.gemini]
# kind = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# model = "gemini-2.5-pro"
# api_key_env = "GEMINI_API_KEY"

# Browser login (`eix auth login <name>`) instead of an API key.
# [providers.anthropic.oauth]
# authorization_endpoint = "https://provider.example/authorize"
# token_endpoint = "https://provider.example/token"
# client_id = "eix"
# client_secret = ""                 # optional
# scopes = ["openid", "offline_access"]
# redirect_uri = "http://127.0.0.1:8765/callback"   # optional
# extra_authorize_params = {}
# extra_token_params = {}

# --- Runtime ----------------------------------------------------------------
[provider_runtime]
timeout_secs = 300
retry_attempts = 8
retry_base_ms = 250
retry_max_secs = 60
max_output_tokens = 8192             # required by Anthropic / Gemini
# context_tokens = 128000
# system_prompt = "You are eix..."
# prompt_profile = "concise"         # default | concise
# persistent_mode = true             # schedules / heartbeats only

# --- Models -----------------------------------------------------------------
# Extra choices for `/model`; `provider` reuses its endpoint and key.

# [[models]]
# id = "openrouter/gpt-5"
# provider = "openrouter"
# model = "openai/gpt-5"
# name = "GPT-5"
# variants = ["low", "medium", "high"]
# input_cost = 1.25                  # USD / 1M tokens
# output_cost = 10.0
# context_tokens = 400000

# [[models]]
# id = "anthropic-fast"
# provider = "anthropic"
# kind = "anthropic"
# model = "claude-haiku-4"
# context_tokens = 200000

# Per-role defaults: execute | plan.
# `execute` is shared by normal turns and exploration sub-agents. `plan` only
# affects Plan mode and falls back to the session's /model pin, then `execute`.
# [model_roles]
# plan = "openrouter/gpt-5"
# execute = "ollama/qwen2.5-coder:7b"

# --- Tools ------------------------------------------------------------------
[tools]
auto_apply_workspace_edits = true
max_output_bytes = 20000
command_timeout_secs = 60
max_parallel_subagents = 32          # 2/4/8/16/32/64/128/256
sandbox = "auto"                     # auto | required | off
sandbox_network = false
snapshots = true
# sandbox_read_paths = ["~/.cargo", "~/.rustup", "~/.cache", "~/.npm"]
# sandbox_writable_roots = ["../shared"]
# external_directory = ["/tmp/shared", "~/.cache/eix/**"]
# network_allow = ["docs.rs", "*.github.com"]   # empty = unrestricted web

# Rules: deny wins, then the most specific ask / allow / sandbox.
# [[tools.rules]]
# id = "deny-rm"
# tool = "exec_command"
# command_regex = "^rm "
# action = "deny"

# [[tools.rules]]
# id = "cargo-test-sandbox"
# tool = "exec_command"
# command = ["cargo", "test"]
# action = "sandbox"

# [[tools.rules]]
# id = "review-src"
# tool = "apply_patch"
# path = "src/**"
# action = "ask"

# [[tools.rules]]
# id = "docs-web"
# tool = "web_fetch"
# path = "https://docs.rs/**"
# action = "allow"

# --- Worktrees --------------------------------------------------------------
[worktree]
auto = false                         # true: create one per new session
base = "auto"                        # or "main"

[integration]
auto_ready = false
auto_commit = true

# [integration.repos."/home/me/project"]
# base = "main"
# test = "cargo test"

# --- Notifications ----------------------------------------------------------
# [notifications]
# bell = false
# command = 'notify-send eix "$EIX_SESSION_NAME: $EIX_STATUS"'
# cooldown_secs = 10

# --- Context ----------------------------------------------------------------
# [context]
# budget_tokens = 32000
# auto_compact = true
# auto_compact_threshold = 0.8
# auto_compact_keep_tokens = 8000
# auto_compact_keep_turns = 2
# tool_output_tokens = 4000
# image_tokens = 1024
# max_tool_schema_tokens = 12000
# instructions_files = ["AGENTS.md"]
# workspace_summary = true

# --- Compatibility ----------------------------------------------------------
# Load other harnesses' global/project resources; project layers can only
# turn these off.
[compations]
claude_code = false                  # ~/.claude + .claude
opencode = false                     # ~/.config/opencode + .opencode
codex_cli = false                    # $CODEX_HOME + .codex
gemini_cli = false                   # ~/.gemini + .gemini
pi = false                           # $PI_CODING_AGENT_DIR + .pi

# --- Remote ----------------------------------------------------------------
# [server]
# tcp = "127.0.0.1:7420"
# http = "127.0.0.1:7421"
# token = "{env:EIX_REMOTE_TOKEN}"

# --- MCP --------------------------------------------------------------------
# stdio servers start lazily and need Node.js / npx.
[mcp.servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp.servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp.servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp.servers.memory.env]
MEMORY_FILE_PATH = "{env:HOME}/.config/eix/memory.json"

# Remote server (Streamable HTTP; `url` and `command` are exclusive).
# [mcp.servers.docs]
# url = "https://mcp.example.com/mcp"
# timeout_secs = 30
# allowed_tools = ["search_*", "read_*"]
# denied_tools = ["write_*"]
#
# [mcp.servers.docs.headers]
# Authorization = "Bearer {env:MCP_TOKEN}"
#
# [mcp.servers.docs.oauth]
# scopes = ["read"]                  # or run `eix mcp auth docs`

# Keep an entry but disable it.
# [mcp.servers.playwright]
# enabled = false

# --- Plugins ----------------------------------------------------------------
# Trusted child processes (not OS-sandboxed); global config only.

# [plugins.echo]
# enabled = true
# manifest = "examples/plugins/echo/eix-plugin.toml"
# capabilities = ["tools", "commands"]
# timeout_secs = 30
# allowed_tools = ["word_*"]
# denied_tools = ["remember"]
#
# Capability-scoped allowlists are empty by default and deny everything.
# network_allow accepts exact hosts or one leading `*.` wildcard.
# network_allow = ["api.example.com", "*.example-cdn.com"]
# secrets lists environment variable names readable through host.secrets.get.
# secrets = ["ECHO_TOKEN"]
# rpc_allow lists other plugins callable through host.rpc.call; "*" allows all.
# rpc_allow = ["other-plugin"]
#
# [plugins.echo.settings]
# repo = "acme"

# No manifest: run the command directly.
# [plugins.local]
# command = "python3"
# args = ["plugin.py"]
# env = { LOG_LEVEL = "debug" }
# cwd = "plugins"

# --- Images -----------------------------------------------------------------
# [images]
# max_prompt_images = 4
# max_image_bytes = 8388608
# retention_days = 30
# max_store_bytes = 2147483648

# --- Display math -----------------------------------------------------------
# Display math is rendered as a terminal image (Kitty, Sixel or iTerm2) when
# the terminal supports it, and as 2D ASCII text otherwise. The TUI shells out
# to `latex`/`dvipng` (or `xelatex` + poppler for CJK). `/math status` reports
# the detected mode and the reason for a fallback.
# [math]
# images = true
# dpi = 200
# max_source_bytes = 65536
# min_scale = 0.5
# max_rows = 60
# Extra preamble (macros, packages) for formulas. Trusted config only: project
# layers cannot set it. EIX_MATH_DPI overrides `dpi`.
# preamble = "\newcommand{\R}{\mathbb{R}}"

# --- LSP --------------------------------------------------------------------
# Built in: bash, cpp, css, go, html, json, lua, markdown, python, rust, sql,
# toml, typescript, yaml. Override or add one here.
# [lsp.servers.rust]
# command = "rust-analyzer"
# extensions = ["rs"]
# timeout_secs = 30

# --- Formatters -------------------------------------------------------------
# Built-in per-extension table; entries here override it.

# [[formatter]]
# command = "rustfmt --edition 2021"
# extensions = ["rs"]

# [[formatter]]
# command = "prettier --write"
# extensions = ["json", "css", "html"]

# Disable one extension with an empty command.
# [[formatter]]
# extensions = ["md"]

# --- Theme ------------------------------------------------------------------
# Presets: light-catppuccin, dark-catppuccin, light-delek, dark-desert,
# dark-dracula, light-github, dark-github, light-gruvbox, dark-gruvbox,
# dark-mariana, dark-monokai, dark-nord, light-one, dark-one,
# light-peachpuff, dark-ron, light-rose-pine, light-solarized,
# dark-solarized, dark-tokyo, light-zellner.
[theme]
preset = "dark-github"
# normal = "#c0caf5"
# comment = "#565f89"
# string = "#9ece6a"
# function = "#7aa2f7"
# error = "#f7768e"
# diff_add = "#9ece6a"
# diff_delete = "#f7768e"
# panel = "#1f2335"

# --- Keys -------------------------------------------------------------------
# Overrides replace defaults; they do not add aliases.
[keys]
leader = "Space"
# sessions = "C-t"
# new_session = "leader N"
# close_pane = "C-q"
# help = "F2"
