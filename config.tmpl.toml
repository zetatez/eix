# eix configuration (TOML)
#
# Global:  ~/.config/eix/config.toml
# Project: <ancestor>/.eix/config.toml (nearest wins; tighten-only)
# Placeholders: {env:NAME}, {file:path} (global/explicit layers only)
#
# Root keys (no table) must stay above the first [table].
# formatter_defaults = true

# --- Providers --------------------------------------------------------------
# The table key is the model prefix. Exactly one provider sets default = true.

[providers.llmgate]
default = true
base_url = "http://127.0.0.1:3210/v1"
model = "deepseek/deepseek-v4.1-flash"
api_key = ""
# api_key_env = "LLMGATE_API_KEY"
# name = "LLM Gate"

# OpenAI-compatible endpoints.
# [providers.openai]
# name = "OpenAI"
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key_env = "OPENAI_API_KEY"

# [providers.deepseek]
# base_url = "https://api.deepseek.com"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"

# DeepSeek native Messages protocol: signed thinking replay, effort control
# (off/low/high/max), in-history prompt updates, and cache-token accounting.
# [providers.deepseek-native]
# kind = "deepseek"
# base_url = "https://api.deepseek.com/anthropic"
# model = "deepseek-v4-flash"
# api_key_env = "DEEPSEEK_API_KEY"

# [providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# model = "anthropic/claude-sonnet-4"
# api_key_env = "OPENROUTER_API_KEY"

# [providers.groq]
# base_url = "https://api.groq.com/openai/v1"
# model = "llama-3.3-70b-versatile"
# api_key_env = "GROQ_API_KEY"

# [providers.xai]
# base_url = "https://api.x.ai/v1"
